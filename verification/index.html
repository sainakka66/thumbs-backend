<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThumbsUp Verification Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1419; color: #e7e9ea; margin: 0; padding: 2rem; }
    h1 { margin: 0 0 0.25rem; }
    .sub { color: #71767b; margin-bottom: 2rem; }
    .overall { padding: 1rem 1.25rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 1.1rem; }
    .overall.ok { background: #0d2818; border: 1px solid #00ba7c; }
    .overall.bad { background: #2a0f0f; border: 1px solid #f4212e; }
    .overall.pending { background: #1a1f26; border: 1px solid #555; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .card { border-radius: 12px; padding: 1rem; border: 1px solid #333; }
    .card.pass { background: #0d2818; border-color: #00ba7c; }
    .card.fail { background: #2a0f0f; border-color: #f4212e; }
    .card.pending { background: #1a1f26; }
    .stat { font-size: 1.75rem; font-weight: 700; }
    code { background: #1a1f26; padding: 0.15rem 0.4rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>ThumbsUp System Health</h1>
  <p class="sub">Run <code>npm run verify:all</code> then refresh this page.</p>
  <div id="overall" class="overall pending">Loading results…</div>
  <div id="grid" class="grid"></div>
  <script>
    fetch('./results/dashboard.json')
      .then((r) => r.json())
      .then((data) => {
        const el = document.getElementById('overall');
        const totalPass = data.suites.reduce((a, s) => a + s.pass, 0);
        const totalAll = data.suites.reduce((a, s) => a + s.total, 0);
        const ok = totalPass === totalAll && totalAll > 0;
        el.className = 'overall ' + (ok ? 'ok' : 'bad');
        el.textContent = (ok ? '✅ ' : '❌ ') + totalPass + '/' + totalAll + ' checks — ' + data.generatedAt;
        document.getElementById('grid').innerHTML = data.suites.map((s) => {
          const cls = s.skipped ? 'pending' : (s.pass === s.total && s.total > 0 ? 'pass' : 'fail');
          return '<div class="card ' + cls + '"><h3>' + s.name + '</h3><div class="stat">' + s.pass + '/' + s.total + '</div><div>' + s.coverage + '</div></div>';
        }).join('');
      })
      .catch(() => {
        document.getElementById('overall').textContent = 'No results yet. Run npm run verify:all';
      });
  </script>
</body>
</html>
